<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Capitals</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 id="study-title">Study Capitals</h1>
  <div class="language-switch">
    <button onclick="setLanguage('en')">English</button>
    <button onclick="setLanguage('bn')">বাংলা</button>
  </div>
</header>

<main>
  <input type="text" id="search" placeholder="Search..." onkeyup="filterList()">
  <ul id="country-list"></ul>
</main>

<script src="data.js"></script>
<script src="language.js"></script>
<script>
let language = localStorage.getItem('lang') || 'en';

function setLanguage(lang){
    language=lang;
    localStorage.setItem('lang', lang);
    renderList();
}

function renderList(){
    let list = document.getElementById('country-list');
    list.innerHTML = '';
    Object.keys(worldData).sort().forEach(c=>{
        let li = document.createElement('li');
        li.innerText = (language==='bn')?`${worldData[c].country.bn} - ${worldData[c].capital.bn}`:`${worldData[c].country.en} - ${worldData[c].capital.en}`;
        list.appendChild(li);
    });
}

function filterList(){
    let filter = document.getElementById('search').value.toLowerCase();
    document.querySelectorAll('#country-list li').forEach(li=>{
        li.style.display = li.innerText.toLowerCase().includes(filter) ? '' : 'none';
    });
}

renderList();
</script>
</body>
</html>
