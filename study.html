<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Capitals — CapitalCraft</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="topbar"><nav class="nav"><a class="brand" href="index.html">🌍 Capital<span>Craft</span></a><div class="nav-actions"><a class="btn secondary" href="index.html">← Home</a><button class="icon-btn" id="themeToggle" onclick="toggleTheme()">☀️ Light</button></div></nav></header>
<main class="wrap"><div class="eyebrow">Study library</div><h1>Explore world capitals.</h1><p>Search by country or capital, or narrow the list by continent.</p>
<div class="toolbar"><input class="field search" id="searchInput" type="search" placeholder="Search country or capital…" autocomplete="off"><select class="field" id="continentSelect"><option value="All">All continents</option></select><select class="field" id="sortSelect"><option value="country">Country A–Z</option><option value="capital">Capital A–Z</option></select></div>
<div class="section-head"><h2>Country directory</h2><span class="count" id="resultCount"></span></div><div class="list" id="studyList"></div><div class="footer">Tip: Try searching “Dhaka” to find Bangladesh.</div></main>
<script src="data.js"></script><script src="common.js"></script><script>
const select=document.getElementById('continentSelect'),search=document.getElementById('searchInput'),sort=document.getElementById('sortSelect'),list=document.getElementById('studyList');
Object.keys(worldData).forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;select.appendChild(o)});
function render(){const q=search.value.trim().toLowerCase(),c=select.value;let rows=[];Object.entries(worldData).forEach(([region,items])=>{if(c!=='All'&&c!==region)return;items.forEach(x=>{if((x.country+' '+x.capital+' '+region).toLowerCase().includes(q))rows.push({...x,region})})});rows.sort((a,b)=>a[sort.value].localeCompare(b[sort.value]));document.getElementById('resultCount').textContent=rows.length+' results';list.innerHTML='';if(!rows.length){list.innerHTML='<div class="empty">No matching country or capital found.</div>';return}rows.forEach(x=>{const row=document.createElement('div');row.className='country';const left=document.createElement('span');left.textContent=x.country+' · '+x.region;const right=document.createElement('span');right.textContent=x.capital;row.append(left,right);list.appendChild(row)})}
[search,select,sort].forEach(el=>el.addEventListener('input',render));render();
</script></body></html>
