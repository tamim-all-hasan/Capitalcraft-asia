<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study World Capitals</title>
<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f8;
}
header{
    background:#1e88e5;
    color:white;
    text-align:center;
    padding:20px;
    font-size:22px;
    font-weight:bold;
}
.container{
    padding:20px;
}
button, select{
    padding:12px;
    font-size:16px;
    border:none;
    border-radius:8px;
    margin-bottom:15px;
    cursor:pointer;
}
button{
    background:#1e88e5;
    color:white;
}
button:hover{
    background:#1565c0;
}
select{
    width:100%;
    margin-bottom:15px;
}
input{
    padding:10px;
    width:100%;
    margin-bottom:15px;
    border-radius:6px;
    border:1px solid #ccc;
    font-size:16px;
}
.list{
    display:flex;
    flex-direction:column;
    gap:8px;
}
.item{
    background:white;
    padding:12px;
    border-radius:6px;
    transition:0.2s;
}
.item:hover{
    background:#e3f2fd;
}
</style>
</head>

<body>

<header>📖 Study World Capitals</header>

<div class="container">
    <button onclick="location.href='index.html'">⬅️ Back to Continent Selection</button>

    <select id="continentSelect" onchange="filterByContinent()">
        <option value="All">🌍 All Continents</option>
        <option value="Asia">Asia</option>
        <option value="Europe">Europe</option>
        <option value="Africa">Africa</option>
        <option value="North America">North America</option>
        <option value="South America">South America</option>
        <option value="Oceania">Oceania</option>
    </select>

    <input type="text" id="searchInput" placeholder="Search Country or Capital..." onkeyup="filterList()">

    <div class="list" id="studyList"></div>
</div>

<script src="data.js"></script>
<script>
// Build full study list dynamically
let studyListDiv = document.getElementById("studyList");
let allItems = [];

function buildStudyList(continent="All"){
    studyListDiv.innerHTML="";
    allItems=[];

    for(let c in worldData){
        if(continent==="All" || continent===c){
            worldData[c].forEach(obj=>{
                let div = document.createElement("div");
                div.className="item";
                div.innerText = `${obj.country} — ${obj.capital} (${c})`;
                studyListDiv.appendChild(div);
                allItems.push(div);
            });
        }
    }
}
buildStudyList();

// Continent filter
function filterByContinent(){
    let continent = document.getElementById("continentSelect").value;
    buildStudyList(continent);
    filterList();
}

// Search filter
function filterList(){
    let val = document.getElementById("searchInput").value.toLowerCase();
    allItems.forEach(item=>{
        if(item.innerText.toLowerCase().includes(val)){
            item.style.display="block";
        } else {
            item.style.display="none";
        }
    });
}
</script>

</body>
</html>
