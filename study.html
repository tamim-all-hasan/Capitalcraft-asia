<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Capitals</title>
<link rel="stylesheet" href="style.css">
<style>
  body { font-family: Arial, sans-serif; margin:0; padding:0; background:#f9f9f9; text-align:center; }
  header { background:#4CAF50; color:white; padding:15px 10px; position:sticky; top:0; }
  header h1 { margin:0; font-size:1.8em; }
  .language-switch button { margin:0 5px; padding:5px 10px; font-size:1em; cursor:pointer; border:none; border-radius:5px; }
  main { padding:20px; }
  #search { padding:10px; font-size:1em; width:80%; max-width:400px; margin-bottom:20px; border-radius:5px; border:1px solid #ccc; }
  #country-list { list-style:none; padding:0; margin:0 auto; max-width:400px; text-align:left; }
  #country-list li { padding:10px; border-bottom:1px solid #ddd; }
</style>
</head>
<body>

<header>
  <h1 id="study-title">Study Capitals</h1>
  <div class="language-switch">
    <button onclick="setLanguage('en')">English</button>
    <button onclick="setLanguage('bn')">বাংলা</button>
  </div>
</header>

<main>
  <input type="text" id="search" placeholder="Search..." onkeyup="filterList()">
  <ul id="country-list"></ul>
</main>

<script src="data.js"></script>
<script src="language.js"></script>
<script>
let language = localStorage.getItem('lang') || 'en';

function setLanguage(lang){
    language = lang;
    localStorage.setItem('lang', lang);
    renderList();
}

function renderList(){
    let list = document.getElementById('country-list');
    list.innerHTML = '';
    Object.keys(worldData).sort().forEach(c=>{
        let li = document.createElement('li');
        li.innerText = (language==='bn') ? 
            `${worldData[c].country.bn} - ${worldData[c].capital.bn}` :
            `${worldData[c].country.en} - ${worldData[c].capital.en}`;
        list.appendChild(li);
    });
}

function filterList(){
    let filter = document.getElementById('search').value.toLowerCase();
    document.querySelectorAll('#country-list li').forEach(li=>{
        li.style.display = li.innerText.toLowerCase().includes(filter) ? '' : 'none';
    });
}

// Initial render
renderList();
</script>
</body>
</html>
