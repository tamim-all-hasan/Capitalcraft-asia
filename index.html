<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Capitals Quiz</title>
<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f8;
}
header{
    background:#1e88e5;
    color:white;
    text-align:center;
    padding:20px;
    font-size:22px;
    font-weight:bold;
}
.container{
    display:flex;
    flex-direction:column;
    gap:15px;
    padding:20px;
}
button{
    padding:15px;
    font-size:18px;
    border:none;
    border-radius:8px;
    background:#1e88e5;
    color:white;
    cursor:pointer;
    transition:0.3s;
}
button:hover{
    background:#1565c0;
}
h2{
    text-align:center;
    margin-bottom:20px;
}
</style>
</head>
<body>

<header>🌍 World Capitals Quiz</header>

<div class="container">
    <h2>Select a Continent to Start Quiz</h2>
    <button onclick="startQuiz('Asia')">🌏 Asia</button>
    <button onclick="startQuiz('Europe')">🌍 Europe</button>
    <button onclick="startQuiz('Africa')">🌍 Africa</button>
    <button onclick="startQuiz('North America')">🌎 North America</button>
    <button onclick="startQuiz('South America')">🌎 South America</button>
    <button onclick="startQuiz('Oceania')">🌏 Oceania</button>
    <button onclick="location.href='study.html'" style="background:#43a047;">📖 Study Capitals</button>
</div>

<script>
function startQuiz(continent){
    // Save selected continent
    localStorage.setItem("selectedContinent", continent);
    // Go to quiz page
    window.location.href = "quiz.html";
}
</script>

</body>
</html>
