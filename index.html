<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Capitals Quiz</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1 id="title">World Capitals Quiz</h1>
  <div class="language-switch">
    <button onclick="setLanguage('en')">English</button>
    <button onclick="setLanguage('bn')">বাংলা</button>
  </div>
</header>

<main>
  <h2 id="select-continent">Select a Continent</h2>
  <div id="continents">
    <button onclick="selectContinent('Asia')">Asia</button>
    <button onclick="selectContinent('Europe')">Europe</button>
    <button onclick="selectContinent('Africa')">Africa</button>
    <button onclick="selectContinent('America')">America</button>
    <button onclick="selectContinent('Oceania')">Oceania</button>
  </div>
</main>

<script src="data.js"></script>
<script src="language.js"></script>
<script>
let language = localStorage.getItem('lang') || 'en';

function setLanguage(lang){
    language = lang;
    localStorage.setItem('lang', lang);
    updateTexts();
}

function updateTexts(){
    document.getElementById('title').innerText = (language === 'bn') ? 'বিশ্ব রাজধানী কুইজ' : 'World Capitals Quiz';
    document.getElementById('select-continent').innerText = (language === 'bn') ? 'মহাদেশ নির্বাচন করুন' : 'Select a Continent';
    document.querySelectorAll('#continents button').forEach(btn=>{
        let cont = btn.innerText;
        if(language==='bn'){
            let map = {'Asia':'এশিয়া','Europe':'ইউরোপ','Africa':'আফ্রিকা','America':'আমেরিকা','Oceania':'ওশেনিয়া'};
            btn.innerText = map[cont];
        } else {
            let map = {'এশিয়া':'Asia','ইউরোপ':'Europe','আফ্রিকা':'Africa','আমেরিকা':'America','ওশেনিয়া':'Oceania'};
            btn.innerText = map[cont];
        }
    });
}

function selectContinent(continent){
    localStorage.setItem('selectedContinent', continent);
    window.location.href = 'quiz.html';
}

updateTexts();
</script>
</body>
</html>
