<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Capital Quiz — CapitalCraft</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="topbar"><nav class="nav"><a class="brand" href="index.html">🌍 Capital<span>Craft</span></a><div class="nav-actions"><a class="btn secondary" href="study.html">📖 Study</a><button class="icon-btn" id="themeToggle" onclick="toggleTheme()">☀️ Light</button></div></nav></header>
<main class="wrap"><div class="eyebrow">Knowledge check</div><h1 id="pageTitle">Capital quiz</h1><p id="subtitle">Choose the correct capital city.</p>
<div class="toolbar"><select class="field" id="continentSelect" aria-label="Choose continent"></select><select class="field" id="lengthSelect" aria-label="Quiz length"><option value="10">10 questions</option><option value="all">All countries</option></select><button class="btn" id="startBtn">Start / Restart</button></div>
<section class="quiz-card" id="quizCard"><div class="progress"><span id="progressBar"></span></div><div class="quiz-meta"><span id="progressText">Ready when you are</span><span id="scoreText">Score: 0</span></div><div id="quizArea"><div class="question" id="question">Select a continent and press Start.</div><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="btn" id="nextBtn" disabled>Next question →</button></div><div class="result" id="result" hidden></div></section><div class="footer">One question at a time. No time pressure.</div></main>
<script src="data.js"></script><script src="common.js"></script><script>
const params=new URLSearchParams(location.search),continentSelect=document.getElementById('continentSelect');
Object.keys(worldData).forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;continentSelect.appendChild(o)});
const requested=params.get('continent');if(requested&&worldData[requested])continentSelect.value=requested;
let questions=[],index=0,score=0,answered=false,current=null;
const $=id=>document.getElementById(id);
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function start(){const continent=continentSelect.value,all=shuffle(worldData[continent]);const count=$('lengthSelect').value==='all'?all.length:Math.min(10,all.length);questions=all.slice(0,count);index=0;score=0;$('result').hidden=true;$('quizArea').hidden=false;$('scoreText').textContent='Score: 0';$('pageTitle').textContent=continent+' capitals';$('subtitle').textContent=count+' questions · '+continent;showQuestion()}
function showQuestion(){answered=false;current=questions[index];$('question').textContent='What is the capital of '+current.country+'?';$('options').innerHTML='';$('feedback').textContent='';$('feedback').className='feedback';$('nextBtn').disabled=true;$('nextBtn').textContent=index===questions.length-1?'See results':'Next question →';const pool=Object.values(worldData).flat().map(x=>x.capital).filter(x=>x!==current.capital);const options=shuffle([current.capital,...shuffle([...new Set(pool)]).slice(0,3)]);options.forEach(cap=>{const b=document.createElement('button');b.className='option';b.textContent=cap;b.onclick=()=>choose(b,cap);$('options').appendChild(b)});updateProgress()}
function choose(button,answer){if(answered)return;answered=true;const correct=answer===current.capital;document.querySelectorAll('.option').forEach(b=>{b.disabled=true;if(b.textContent===current.capital)b.classList.add('correct')});if(correct){score++;$('feedback').textContent='Correct! Nice work.';$('feedback').className='feedback good'}else{button.classList.add('wrong');$('feedback').textContent='Not quite. Correct answer: '+current.capital;$('feedback').className='feedback bad'}$('scoreText').textContent='Score: '+score;$('nextBtn').disabled=false}
function updateProgress(){const done=index;$('progressBar').style.width=(done/questions.length*100)+'%';$('progressText').textContent='Question '+(index+1)+' of '+questions.length}
function next(){if(!answered)return;if(index<questions.length-1){index++;showQuestion()}else finish()}
function finish(){ $('quizArea').hidden=true;$('result').hidden=false;$('progressBar').style.width='100%';const pct=Math.round(score/questions.length*100);$('progressText').textContent='Completed';$('result').innerHTML='<div class="eyebrow">Quiz completed</div><div class="score">'+pct+'%</div><h2>'+score+' out of '+questions.length+' correct</h2><p>'+(pct>=80?'Excellent recall. Keep it up!':pct>=50?'Good effort. Review the missed capitals and try again.':'A good start. Study the list and give it another try.')+'</p><button class="btn" id="againBtn" style="margin-top:20px">Try again</button>';$('againBtn').onclick=start;saveQuizResult(continentSelect.value,score,questions.length)}
$('startBtn').onclick=start;$('nextBtn').onclick=next;
</script></body></html>
