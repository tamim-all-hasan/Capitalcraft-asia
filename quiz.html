<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz</title>
<link rel="stylesheet" href="style.css">
<style>
  body { font-family: Arial, sans-serif; margin:0; padding:0; text-align:center; background:#f9f9f9; }
  header { background:#4CAF50; color:white; padding:15px 10px; position:sticky; top:0; }
  header h1 { margin:0; font-size:1.8em; }
  .language-switch button { margin:0 5px; padding:5px 10px; font-size:1em; cursor:pointer; border:none; border-radius:5px; }
  main { padding:20px; }
  #options button { display:block; margin:10px auto; padding:10px 20px; font-size:1.2em; cursor:pointer; border:none; border-radius:8px; background:#2196F3; color:white; transition:0.2s; width:60%; max-width:300px; }
  #options button:hover { background:#1976D2; }
  #feedback { margin-top:15px; font-size:1.4em; height:30px; }
  #score { margin-top:15px; font-size:1.2em; font-weight:bold; }
</style>
</head>
<body>

<header>
  <h1 id="quiz-title">Quiz</h1>
  <div class="language-switch">
    <button onclick="setLanguage('en')">English</button>
    <button onclick="setLanguage('bn')">বাংলা</button>
  </div>
</header>

<main>
  <h2 id="question">Question</h2>
  <div id="options"></div>
  <div id="feedback"></div>
  <div id="score"></div>
</main>

<script src="data.js"></script>
<script src="language.js"></script>
<script>
let language = localStorage.getItem('lang') || 'en';
let selectedContinent = localStorage.getItem('selectedContinent');
if(!selectedContinent) window.location.href = 'index.html';

let continentMap = {
    'Asia':['India','China','Japan','Nepal','Indonesia'],
    'Europe':['France','Germany','Italy','Spain','Sweden'],
    'Africa':['Nigeria','Egypt','Kenya','South_Africa','Ghana'],
    'America':['USA','Canada','Brazil','Mexico','Argentina'],
    'Oceania':['Australia','New_Zealand','Fiji','Papua_New_Guinea','Samoa']
}; // demo, full list replace করতে পারো

let countries = continentMap[selectedContinent];
let score = 0;
let current = 0;

// Set language
function setLanguage(lang){
    language = lang;
    localStorage.setItem('lang', lang);
    updateQuiz();
}

// Update quiz question, options, feedback
function updateQuiz(){
    if(current >= countries.length){
        document.getElementById('question').innerText = (language==='bn')?'কুইজ শেষ!':'Quiz Over!';
        document.getElementById('options').innerHTML = '';
        document.getElementById('feedback').innerText = '';
        document.getElementById('score').innerText = (language==='bn')?'আপনার স্কোর: '+score:'Your score: '+score;
        return;
    }

    let country = countries[current];
    let correctCapital = (language==='bn') ? worldData[country].capital.bn : worldData[country].capital.en;
    document.getElementById('question').innerText = (language==='bn') ? 
        `দেশ: ${worldData[country].country.bn}` : `Country: ${worldData[country].country.en}`;

    let optionsDiv = document.getElementById('options');
    optionsDiv.innerHTML = '';
    
    // Generate 4 options
    let opts = [correctCapital];
    while(opts.length < 4){
        let randCountry = countries[Math.floor(Math.random()*countries.length)];
        let randCap = (language==='bn') ? worldData[randCountry].capital.bn : worldData[randCountry].capital.en;
        if(!opts.includes(randCap)) opts.push(randCap);
    }
    opts = opts.sort(()=>Math.random()-0.5);

    opts.forEach(opt=>{
        let btn = document.createElement('button');
        btn.innerText = opt;
        btn.onclick = ()=>{
            if(opt === correctCapital){
                score++;
                document.getElementById('feedback').innerText = '✅';
            } else {
                document.getElementById('feedback').innerText = (language==='bn') ? `❌ সঠিক উত্তর: ${correctCapital}` : `❌ Correct: ${correctCapital}`;
            }
            current++;
            setTimeout(updateQuiz, 700);
        };
        optionsDiv.appendChild(btn);
    });

    document.getElementById('score').innerText = (language==='bn')?'স্কোর: '+score:'Score: '+score;
}

updateQuiz();
</script>
</body>
</html>
